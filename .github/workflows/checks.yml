# The cheap gate: typecheck, the conformance suite, and a parse of the edge
# functions (which `tsc` can't see — they're Deno, with remote imports).
#
# Deliberately small (~1 min). The desktop release (release.yml) runs in parallel
# on every push to master — see docs/desktop-releases.md.
name: checks

on:
  push:
    branches-ignore: []
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 22, not 20: @supabase/supabase-js and @testing-library/jest-dom both
          # declare `node >= 22`, and 20 logged EBADENGINE on every run.
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (SPA)
        run: npm run typecheck
      - name: Conformance suite (app ↔ agent must agree)
        run: npm test
      # The chat's behavioral battery is deliberately NOT here: it calls a live
      # model, so it costs money and its result is sampled. `npm test` already
      # runs the deterministic half (tools ↔ handlers ↔ prompt ↔ snapshot, and
      # the turn loop) plus any recorded runs. Run `npm run eval` by hand before
      # shipping a prompt, a tool or a model change — docs/agent-conformance.md.
      - name: Parse the edge functions
        run: |
          set -e
          find supabase/functions -name '*.ts' -print0 \
            | xargs -0 -n1 npx esbuild --bundle=false --outfile=/dev/null
