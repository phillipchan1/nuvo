# The cheap gate: actionlint on every workflow, typecheck, the conformance
# suite, and a parse of the edge functions (which `tsc` can't see — they're
# Deno, with remote imports).
# Never upload pg_dump, CSV, or row-data artifacts. scripts/guard-public-ci.mjs
# fails the job if any workflow uploads anything other than
# artifacts/cutover-report.md (counts + md5 only).
#
# Deliberately small (~1 min). The desktop release (release.yml) and iOS TestFlight
# upload (ios-release.yml) run in parallel on every push to master — see
# docs/desktop-releases.md and docs/ios-releases.md.
name: checks

on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nuvo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nuvo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: actionlint
        name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
      - id: setup-node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # 22, not 20: @supabase/supabase-js and @testing-library/jest-dom both
          # declare `node >= 22`, and 20 logged EBADENGINE on every run.
          node-version: 22
          cache: npm
      - id: npm-ci
        run: npm ci
      - id: guard
        name: Public-repo artifact allowlist
        run: node scripts/guard-public-ci.mjs
      - id: typecheck
        name: Typecheck (SPA)
        run: npm run typecheck
      - id: test
        name: Conformance suite (app ↔ agent must agree)
        env:
          # APP_TZ is America/Los_Angeles. Capture "Tomorrow" labels only
          # match startOfDay(new Date()) when the runner's zone agrees;
          # ubuntu-latest is UTC, which splits the calendar day 00:00–07:00.
          TZ: America/Los_Angeles
        run: npm test
      # The chat's behavioral battery is deliberately NOT here: it calls a live
      # model, so it costs money and its result is sampled. `npm test` already
      # runs the deterministic half (tools ↔ handlers ↔ prompt ↔ snapshot, and
      # the turn loop) plus any recorded runs. Run `npm run eval` by hand before
      # shipping a prompt, a tool or a model change — docs/agent-conformance.md.
      - id: parse-fns
        name: Parse the edge functions
        run: |
          set -e
          find supabase/functions -name '*.ts' -print0 \
            | xargs -0 -n1 npx esbuild --bundle=false --outfile=/dev/null
      - id: worker-typecheck
        name: Worker typecheck
        run: npm run typecheck:worker
      - id: worker-check
        name: Worker auth + isolation + adapter checks
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nuvo
        run: npm run check:worker
      - id: cf-preview
        name: Wrangler preview dry-run
        run: npm run cf:preview:dry-run

  isolation-mutation:
    name: isolation-mutation
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: setup-node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - id: npm-ci
        run: npm ci
      - id: isolation-mutation
        name: Isolation mutation proof
        run: npm run check:isolation-mutation
