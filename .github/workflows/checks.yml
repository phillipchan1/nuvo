# The cheap gate: typecheck, the conformance suite, and a parse of the edge
# functions (which `tsc` can't see — they're Deno, with remote imports).
#
# Deliberately small (~1 min). The desktop release (release.yml) runs in parallel
# on every push to master — see docs/desktop-releases.md.
name: checks

on:
  push:
    branches-ignore: []
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 22, not 20. `npm ci` on npm 10 (what Node 20 ships) cannot validate a
          # lockfile written by npm 11 — it reads the bundleDependencies of
          # @tailwindcss/oxide-wasm32-wasi as unresolved and refuses to install.
          # The gate was red on every commit for a day without ever reaching a
          # test. Several deps (@supabase/supabase-js, @testing-library/jest-dom)
          # also declare `node >= 22`, so 20 was already the wrong floor.
          node-version: 22
          cache: npm
      # npm 11 is what WRITES the lockfile on the dev machine, so it has to be
      # what reads it here. Node 22 still ships npm 10, and npm 10 reads the
      # bundleDependencies of @tailwindcss/oxide-wasm32-wasi as unresolved
      # (@emnapi/core, @emnapi/runtime) and refuses to install. Bumping Node
      # alone did not fix it — the version that matters is npm's, not Node's.
      - run: npm install -g npm@11
      - run: npm ci
      - name: Typecheck (SPA)
        run: npm run typecheck
      - name: Conformance suite (app ↔ agent must agree)
        run: npm test
      # The chat's behavioral battery is deliberately NOT here: it calls a live
      # model, so it costs money and its result is sampled. `npm test` already
      # runs the deterministic half (tools ↔ handlers ↔ prompt ↔ snapshot, and
      # the turn loop) plus any recorded runs. Run `npm run eval` by hand before
      # shipping a prompt, a tool or a model change — docs/agent-conformance.md.
      - name: Parse the edge functions
        run: |
          set -e
          find supabase/functions -name '*.ts' -print0 \
            | xargs -0 -n1 npx esbuild --bundle=false --outfile=/dev/null
