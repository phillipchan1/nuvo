# Static hosting on Cloudflare Workers (assets only, no Worker code) for
# app.nuvo.day (Worker `nuvo-app`, wrangler.app.jsonc) and nuvo.day /
# www.nuvo.day (Worker `nuvo-site`, marketing/wrangler.jsonc). Replaces the
# Vercel git deploys of projects `nuvo` and `nuvo-site` — see
# docs/cloudflare-hosting.md.
#
# push to master  -> production Workers (custom domains above)
# pull_request    -> `--env preview` Workers on workers.dev only (no domains)
# workflow_dispatch -> production, for a manual redeploy
#
# This is hosting only: the bundle talks to Supabase exactly as it did on
# Vercel. It never deploys the `nuvo` API Worker (wrangler.jsonc).
#
# Needs: secret CLOUDFLARE_API_TOKEN (Workers Scripts:Edit on the account),
# and the VITE_* secrets release.yml already
# uses plus VITE_VAPID_PUBLIC_KEY.
name: cloudflare-hosting

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cloudflare-hosting-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fork PRs get no secrets; skip rather than fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c1f7fb7e8c746389e2c56c499805d3e1
      WRANGLER_ENV_FLAG: ${{ github.event_name == 'pull_request' && '--env preview' || '' }}
    steps:
      - id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: setup-node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - id: install
        run: npm ci
      - id: build-app
        name: Build the app (same command Vercel ran)
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        run: |
          set -euo pipefail
          test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY"
          npm run build:web
          test -f dist/index.html && test -f dist/sw.js && test -f dist/_headers
      - id: build-site
        name: Build the marketing site (prerendered)
        working-directory: marketing
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f dist/privacy/index.html
      - id: deploy-app
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          # shellcheck disable=SC2086
          npx wrangler deploy -c wrangler.app.jsonc $WRANGLER_ENV_FLAG
      - id: deploy-site
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          npx wrangler deploy -c marketing/wrangler.jsonc $WRANGLER_ENV_FLAG
