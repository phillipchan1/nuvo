name: Release

# Builds, signs, notarizes, and publishes the macOS desktop app.
#
# The repo is public (Actions are free), but releases are THROTTLED so pushing
# code doesn't ship on every commit. A release fires when:
#   • a commit message contains [release]   → push freely; ship intentionally
#   • a version tag vX.Y.Z is pushed          → that exact version
#   • push/cron: scripts/should-release.mjs says SHIP for commits since the
#     last published build (heuristic for fix/data-quality touching src/, else
#     a cheap OpenAI call; SKIP on doubt / AI failure)
#   • you run it on demand                     → Actions "Run workflow", or a
#     Claude session running `gh workflow run release.yml` when you say "cut a
#     release" / "rebuild this"
#
# Docs/marketing/CI-only pushes still skip. On-demand + tags always build.
#
# Publishes a UNIVERSAL (Apple Silicon + Intel) DMG + the updater artifacts
# (.app.tar.gz + .sig) + latest.json to the PUBLIC releases repo
# phillipchan1/nuvo-releases as GitHub's `--latest` release. Installed apps poll
# releases/latest/download/latest.json (baked into src-tauri/tauri.conf.json) and
# auto-update. The marketing "Download for Mac" link resolves the same repo's
# latest Nuvo.dmg.
on:
  push:
    branches: [master]
    tags: ["v*"]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASES_REPO: phillipchan1/nuvo-releases

jobs:
  # Cheap gate on the expensive macOS build. Tags and manual dispatch always
  # build; [release] in the commit message always builds; otherwise push + the
  # daily cron ask scripts/should-release.mjs (commits since last-built-sha.txt
  # in the releases repo) whether a desktop user would notice.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          REF_TYPE="${{ github.ref_type }}"
          GO=false
          REASON="default skip"

          if [ "$EVENT" = "workflow_dispatch" ] || [ "$REF_TYPE" = "tag" ]; then
            GO=true
            REASON="dispatch/tag always builds"
          elif [ "$EVENT" = "push" ] && [[ "$MSG" == *"[release]"* ]]; then
            GO=true
            REASON="commit message contains [release]"
          elif [ "$EVENT" = "push" ] || [ "$EVENT" = "schedule" ]; then
            LAST_SHA=$(gh api "repos/${RELEASES_REPO}/contents/last-built-sha.txt" \
              --jq '.content' 2>/dev/null | base64 -d | tr -d '[:space:]' || echo "")
            if [ -z "$LAST_SHA" ]; then
              GO=true
              REASON="no last-built-sha yet — first release"
            elif [ "$LAST_SHA" = "${{ github.sha }}" ]; then
              GO=false
              REASON="HEAD already published"
            else
              VERDICT=$(node scripts/should-release.mjs "$LAST_SHA" | tee /dev/stderr | awk '{print $1; exit}')
              if [ "$VERDICT" = "SHIP" ]; then
                GO=true
              else
                GO=false
              fi
              REASON="should-release → ${VERDICT:-SKIP}"
            fi
          fi

          echo "go=$GO" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT ref_type=$REF_TYPE → build=$GO ($REASON)"

  release:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    # Concurrency lives on the BUILD job only — the cheap gate job is not in this
    # group, so a plain push (gate runs, then skips) can never cancel an
    # in-flight build. Real builds still collapse: a newer one supersedes an
    # older one.
    concurrency:
      group: release-build
      cancel-in-progress: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compute version
        # Tag push (vX.Y.Z) → that exact version. Manual dispatch → <major>.<minor>
        # from package.json + the run number as a monotonic patch. Written into
        # BOTH tauri.conf.json (the app's real version, what the updater compares)
        # and package.json (what the __APP_VERSION__ Vite define bakes in for
        # display) — CI working tree only, never committed.
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            MAJOR_MINOR=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
            VERSION="${MAJOR_MINOR}.${{ github.run_number }}"
          fi
          node -e "for (const p of ['src-tauri/tauri.conf.json','package.json']) { const fs=require('fs'); const c=JSON.parse(fs.readFileSync(p)); c.version='$VERSION'; fs.writeFileSync(p, JSON.stringify(c,null,2)+'\n'); }"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION"

      - name: Enable Apple signing when configured
        # Swap the ad-hoc "-" signing identity for the real Developer ID only
        # when the cert secrets exist; otherwise the build stays ad-hoc so it
        # still succeeds (unsigned) before the Apple secrets are added.
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$IDENTITY" ] && [ -n "$CERT" ] && [ -n "$CERT_PASSWORD" ]; then
            node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p));c.bundle.macOS.signingIdentity=process.env.IDENTITY;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"
            echo "Apple signing identity set — build will be signed + notarized."
          else
            echo "Missing cert/identity/password — building unsigned (ad-hoc)."
          fi

      - name: Generate release notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -uo pipefail
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "PUB_DATE=$PUB_DATE" >> "$GITHUB_ENV"
          BEFORE="${{ github.event.before }}"
          ZEROS="0000000000000000000000000000000000000000"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZEROS" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            COMMITS=$(git log -1 --no-merges --pretty=format:'- %s')
          else
            COMMITS=$(git log "${BEFORE}..HEAD" --no-merges --pretty=format:'- %s')
          fi
          [ -z "$COMMITS" ] && COMMITS="- Minor improvements and behind-the-scenes fixes."
          printf '%s\n' "$COMMITS" | node scripts/release-notes.mjs > RELEASE_NOTES.md
          echo "Generated release notes:"; cat RELEASE_NOTES.md

      - name: Assemble bundled changelog
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -uo pipefail
          node scripts/assemble-changelog.mjs
          echo "Bundled changelog:"; cat public/changelog.json

      - name: Build, sign, and notarize
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Tauri updater signature (minisign) — proves the update payload.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer ID codesign + notarization. Each is gated on the cert
          # existing so an empty secret never triggers a failing keychain import.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          # Notarization via Apple ID + app-specific password (Tauri runs notarytool
          # itself — no .p8 file to materialize). App Store Connect API-key auth is
          # also supported by Tauri if you'd rather; swap these three for
          # APPLE_API_ISSUER/APPLE_API_KEY/APPLE_API_KEY_PATH and write the .p8 to disk.
          APPLE_ID: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -uo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                  APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            echo "No Apple cert/password — building unsigned (ad-hoc)."
          else
            echo "Apple cert + password present — building signed + notarized."
          fi
          for attempt in 1 2 3; do
            echo "::group::tauri build (attempt $attempt)"
            if npm run tauri build -- --target universal-apple-darwin --verbose; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed — detaching stale volumes…"
            for vol in /Volumes/Nuvo*; do
              [ -d "$vol" ] && hdiutil detach "$vol" -force || true
            done
            sleep 5
          done
          echo "All build attempts failed"; exit 1

      - name: Publish to releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle"

          DMG=$(ls "$BUNDLE"/dmg/*.dmg | head -1)
          APPTAR=$(ls "$BUNDLE"/macos/*.app.tar.gz | head -1)
          SIG=$(cat "$BUNDLE"/macos/*.app.tar.gz.sig)
          APPTAR_NAME=$(basename "$APPTAR")
          ASSET_URL="https://github.com/${RELEASES_REPO}/releases/download/${TAG}/${APPTAR_NAME}"

          # Stable-named copy so the marketing site's static download link
          # (releases/latest/download/Nuvo.dmg) always resolves.
          STABLE_DMG="Nuvo.dmg"
          cp "$DMG" "$STABLE_DMG"

          # latest.json is what installed apps poll. Both arch keys point at the
          # same universal artifact.
          jq -n \
            --arg v "$APP_VERSION" \
            --rawfile notes RELEASE_NOTES.md \
            --arg date "$PUB_DATE" \
            --arg sig "$SIG" \
            --arg url "$ASSET_URL" \
            '{version:$v, notes:$notes, pub_date:$date, platforms:{"darwin-aarch64":{signature:$sig, url:$url},"darwin-x86_64":{signature:$sig, url:$url}}}' \
            > latest.json

          echo "Generated latest.json:"; cat latest.json

          # --latest serves latest.json + Nuvo.dmg at releases/latest/download/…
          gh release create "$TAG" \
            --repo "$RELEASES_REPO" \
            --title "Nuvo v${APP_VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --latest \
            "$DMG" "$STABLE_DMG" "$APPTAR" latest.json

      - name: Record built SHA
        # Lets the daily cron skip when master hasn't changed since this release.
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          CONTENT=$(printf '%s' '${{ github.sha }}' | base64)
          FILE_SHA=$(gh api "repos/${RELEASES_REPO}/contents/last-built-sha.txt" \
            --jq '.sha' 2>/dev/null || echo "")
          EXTRA_ARGS=()
          [ -n "$FILE_SHA" ] && EXTRA_ARGS+=(--field "sha=$FILE_SHA")
          gh api "repos/${RELEASES_REPO}/contents/last-built-sha.txt" \
            --method PUT \
            --field "message=Record built SHA ${{ github.sha }}" \
            --field "content=$CONTENT" \
            "${EXTRA_ARGS[@]}"
