<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141320" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" keeps the status bar an opaque, theme-colored strip whose
         glyphs iOS picks for contrast; black-translucent forced white glyphs
         over the light Warm Paper background. The bar colour itself follows the
         runtime-updated theme-color meta (see useThemeColor). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nuvo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Nuvo</title>
  </head>
