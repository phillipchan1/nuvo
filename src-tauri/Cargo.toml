[package]
name = "nuvo"
version = "0.1.0"
description = "Nuvo — Daily Planner"
authors = ["Phil Chan"]
edition = "2021"

[lib]
name = "nuvo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "devtools"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `nuvo://capture` / `nuvo://chat` — how the iOS lock-screen widgets reach the
# app. On Apple platforms the plugin listens for RunEvent::Opened, which is what
# iOS delivers a custom-scheme URL through (the scheme itself is registered in
# scripts/ios-postinit.sh); MobileShell turns the URL into an overlay.
tauri-plugin-deep-link = "2"
# Hands a paired Apple Watch a credential over WatchConnectivity. iOS-only in
# substance; on every other platform each command is a no-op reporting
# `supported: false`, so the SPA needs no platform branch.
tauri-plugin-nuvo-watch = { path = "plugins/nuvo-watch" }

# Global hotkey is desktop-only; the crate doesn't build for mobile targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# The ⌥Space spotlight is a macOS NSPanel (non-activating) so it can take the
# keyboard without stealing focus from whatever app you're in — Spotlight/Raycast
# feel. macOS-only; other desktops fall back to a plain focused window.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
# We place the traffic lights ourselves (place_traffic_lights in lib.rs) —
# tauri.conf.json's value is clobbered when wry re-lays out the titlebar.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.4.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# GHSA-wrw7-89jp-8q8g / RUSTSEC-2024-0429: glib < 0.20.0 has an unsound
# VariantStrIter. Dependabot cannot jump 0.18.x → 0.20.0 because Tauri 2's
# Linux stack (gtk 0.18 / webkit2gtk 2.0) requires glib ^0.18, and gtk3-rs
# is unmaintained — there is no gtk 0.20. crates.io glib 0.20 is a gtk-rs-core
# major and will not compile against those GTK3 crates.
#
# The path crate is glib 0.18.5 + the upstream `&p` → `&mut p` fix
# (gtk-rs-core#1343), versioned 0.20.0 so the lock clears the advisory.
# The other path crates are the same GTK3 releases with only their glib
# requirement rewritten to 0.20. Drop this section when Tauri 3 / GTK4
# ships. See patched/README.md.
[patch.crates-io]
glib = { path = "patched/glib" }
atk = { path = "patched/atk" }
cairo-rs = { path = "patched/cairo-rs" }
gdk = { path = "patched/gdk" }
gdk-pixbuf = { path = "patched/gdk-pixbuf" }
gdkx11 = { path = "patched/gdkx11" }
gio = { path = "patched/gio" }
gtk = { path = "patched/gtk" }
javascriptcore-rs = { path = "patched/javascriptcore-rs" }
libappindicator = { path = "patched/libappindicator" }
pango = { path = "patched/pango" }
soup3 = { path = "patched/soup3" }
webkit2gtk = { path = "patched/webkit2gtk" }
