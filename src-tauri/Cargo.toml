[package]
name = "nuvo"
version = "0.1.0"
description = "Nuvo — Daily Planner"
authors = ["Phil Chan"]
edition = "2021"

[lib]
name = "nuvo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "devtools"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Global hotkey is desktop-only; the crate doesn't build for mobile targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# The ⌥Space spotlight is a macOS NSPanel (non-activating) so it can take the
# keyboard without stealing focus from whatever app you're in — Spotlight/Raycast
# feel. macOS-only; other desktops fall back to a plain focused window.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
