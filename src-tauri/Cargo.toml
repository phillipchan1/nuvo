[package]
name = "nuvo"
version = "0.1.0"
description = "Nuvo — Daily Planner"
authors = ["Phil Chan"]
edition = "2021"

[lib]
name = "nuvo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g (glib < 0.20, VariantStrIter unsoundness).
# Dependabot cannot bump this — run 32581400656 on master (`security_update_not_possible`):
# latest resolvable 0.18.5, patched 0.20.0.
# glib is not a Nuvo dep. It is transitive Linux GTK3: tauri 2 → wry → webkit2gtk 2.0
# + gtk 0.18, which requires glib ^0.18. crates.io glib 0.20 is a 0.x breaking
# gtk-rs-core major; gtk3-rs is unmaintained. Reproduced:
#   cargo update -p glib --precise 0.20.0
#   → failed to select glib = "^0.18" (required by gtk v0.18.2 / tauri 2.11.2)
# A [patch.crates-io] to crates.io 0.20.0 has the same resolve failure.
# Do not vendor gtk-rs (closed #37). Revisit when Tauri ships GTK4 / webkit6.
# Advisory is Linux-only; shipped targets are macOS + iOS, which do not compile glib.
tauri = { version = "2", features = ["macos-private-api", "devtools"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `nuvo://capture` / `nuvo://chat` — how the iOS lock-screen widgets reach the
# app. On Apple platforms the plugin listens for RunEvent::Opened, which is what
# iOS delivers a custom-scheme URL through (the scheme itself is registered in
# scripts/ios-postinit.sh); MobileShell turns the URL into an overlay.
tauri-plugin-deep-link = "2"
# Hands a paired Apple Watch a credential over WatchConnectivity. iOS-only in
# substance; on every other platform each command is a no-op reporting
# `supported: false`, so the SPA needs no platform branch.
tauri-plugin-nuvo-watch = { path = "plugins/nuvo-watch" }
# StoreKit auto-renewable IAP. iOS-only in substance; desktop commands are
# no-ops reporting `supported: false`.
tauri-plugin-nuvo-iap = { path = "plugins/nuvo-iap" }

# Global hotkey is desktop-only; the crate doesn't build for mobile targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# The ⌥Space spotlight is a macOS NSPanel (non-activating) so it can take the
# keyboard without stealing focus from whatever app you're in — Spotlight/Raycast
# feel. macOS-only; other desktops fall back to a plain focused window.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
# We place the traffic lights ourselves (place_traffic_lights in lib.rs) —
# tauri.conf.json's value is clobbered when wry re-lays out the titlebar.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.4.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
