<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- iOS/PWA variant of app-icon.svg ("Statement", D-191): same flat
       mulberry field, N and ember full stop, but full-bleed — no rounded
       corners, no transparency. iOS (and Safari's home-screen webclip mask,
       and Android's maskable crop) applies its own mask on top of whatever
       you give it; baking our own rounded corners in too caused a visible
       ring where the two masks didn't line up. Keep this file's field rect
       corner-radius-free. The glyph sits inside the 80% maskable safe circle
       (its farthest corner is ~370px from centre, the circle's radius 410). -->
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#8e2fa3"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
  <g fill="#ffffff">
    <rect x="214" y="292" width="132" height="440" rx="12"/>
    <rect x="516" y="292" width="132" height="440" rx="12"/>
    <polygon points="214,292 346,292 648,732 516,732"/>
  </g>
  <circle cx="750" cy="666" r="66" fill="#ff6a33"/>
</svg>
