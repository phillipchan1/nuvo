<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- iOS/PWA variant of app-icon.svg: same "Warm Paper" twilight field and
       Fraunces "N", but full-bleed — no rounded corners, no transparency.
       iOS (and Safari's home-screen webclip mask) applies its own squircle
       mask on top of whatever you give it; baking our own rounded corners in
       too caused a visible ring where the two masks didn't line up (the
       corners we'd cut and filled with Warm Paper peeked out from behind
       iOS's slightly different curve). Keep this file's field rect corner-
       radius-free. The desktop/.icns variant (app-icon.svg) keeps its own
       squircle + margin — macOS does not mask app icons for you. -->
  <defs>
    <linearGradient id="field" x1="150" y1="90" x2="900" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6b3a66"/>
      <stop offset="0.42" stop-color="#8f5388"/>
      <stop offset="0.72" stop-color="#c06f55"/>
      <stop offset="1" stop-color="#e2680f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1024">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#field)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
