<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Nuvo app icon: "Statement" (D-191). A geometric N with an ember full
       stop on a flat mulberry field — the way every hero in the app ends
       ("Ship onboarding."). Mulberry is the accent token, ember the signal token: intent,
       and now. All geometry, no font, so this master renders anywhere.

       This is the desktop/.icns variant: macOS doesn't mask app icons for
       you, so the squircle (rx 226) and its transparent corners are baked in
       here. iOS, and anything else the OS masks itself (native app icon,
       Safari's home-screen webclip, the PWA maskable icon), uses the
       full-bleed sibling app-icon-ios.svg instead — see its comment for why.
       The in-app mark is the same drawing: src/components/kit/Mark.tsx. -->
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="226" fill="#8e2fa3"/>
  <rect width="1024" height="1024" rx="226" fill="url(#sheen)"/>
  <g fill="#ffffff">
    <rect x="214" y="292" width="132" height="440" rx="12"/>
    <rect x="516" y="292" width="132" height="440" rx="12"/>
    <polygon points="214,292 346,292 648,732 516,732"/>
  </g>
  <circle cx="750" cy="666" r="66" fill="#ff6a33"/>
</svg>
