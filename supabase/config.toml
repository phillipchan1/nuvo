# Edge function auth settings.
# OAuth callbacks (Google/Microsoft redirect the browser here without our
# Authorization header) and the Google webhook must be publicly reachable;
# each validates its own credentials (signed state / channel token).

[functions.google-oauth]
verify_jwt = false

[functions.m365-oauth]
verify_jwt = false

[functions.google-webhook]
verify_jwt = false

# Stripe calls this directly (no Supabase JWT) — it verifies the Stripe
# signature itself via STRIPE_WEBHOOK_SECRET instead of requireUser().
[functions.stripe-webhook]
verify_jwt = false

# App Store Server Notifications V2 — Apple calls this directly (no Supabase
# JWT). The function decodes the signed payload and optionally checks
# APPLE_NOTIFICATION_SECRET on the URL.
[functions.apple-webhook]
verify_jwt = false

# The Capture API authenticates with an opaque per-connection bearer token, not
# a Supabase JWT, so the gateway has to pass the header through to us. The
# function hashes the token and looks it up in `connections` (owner-scoped, RLS,
# revocable) — see supabase/functions/capture/index.ts. Turning this on would
# make every capture 401 before the function ever runs.
[functions.capture]
verify_jwt = false

# MCP authenticates with the same opaque connection token as Capture, not a
# Supabase JWT. The gateway has to pass Authorization through; the function
# hashes it and looks it up in `connections`. See supabase/functions/mcp/.
[functions.mcp]
verify_jwt = false

# Resend inbound webhook — Svix signature + the recipient token, no JWT.
[functions.inbound-email]
verify_jwt = false
